# polymaker MICRO-CAPITAL defaults (~USD 20–30 bankroll).
# Secrets live in .env only. Original upstream presets: config-original/

[wallet]
chain_id = 137
# 0=EOA, 1=magic proxy, 2=Gnosis Safe proxy, 3=POLY_1271 deposit wallet (current)
signature_type = 3
clob_host = "https://clob.polymarket.com"
gamma_host = "https://gamma-api.polymarket.com"
data_api_host = "https://data-api.polymarket.com"
polygon_rpc = "https://polygon-bor-rpc.publicnode.com"

[engine]
debounce_ms = 250
quoter_tick_s = 60
reconcile_interval_s = 20
catalog_refresh_s = 300
heartbeat = true
heartbeat_interval_s = 5
journal = true
loop = "uvloop"

[risk]
# Sized for ~$20–30 USDC/pUSD starting capital (from polymarket-terminal small-size ethos)
max_total_exposure_usdc = 25.0
max_event_group_loss_usdc = 20.0
max_market_notional_usdc = 12.0
daily_loss_kill_usdc = 4.0
ws_stale_halt_s = 10.0
user_ws_blind_halt_s = 15.0
heartbeat_halt_failures = 3
max_order_error_rate = 0.25

[execution]
rate_budget_fraction = 0.25
post_only = true
max_orders_per_batch = 5

[paths]
db = "state.db"
journal_dir = "journal"
log_dir = "logs"
